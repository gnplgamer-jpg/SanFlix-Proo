name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          yarn install
          yarn add react-is

      - name: Build Web App
        run: yarn run build

      - name: Install Capacitor
        run: |
          yarn add @capacitor/core
          yarn add -D @capacitor/cli @capacitor/android @capacitor/assets
          yarn add @aparajita/capacitor-biometric-auth

      - name: Initialize Android Platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          # Run the assets generator to apply the logo
          npx @capacitor/assets generate --android --assetPath resources || npx @capacitor/assets generate --android --assetPath assets || true
          npx cap sync

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inject Manifest Variables
        run: |
          node -e "const fs=require('fs'); const path='android/app/src/main/AndroidManifest.xml'; let xml=fs.readFileSync(path,'utf8'); if(!xml.includes('USE_BIOMETRIC')){xml=xml.replace('</manifest>', '    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n</manifest>');} if(!xml.includes('com.google.android.gms.ads.APPLICATION_ID')){xml=xml.replace('</application>', '    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-8551073579787342~9404319474\"/>\n    </application>');} fs.writeFileSync(path,xml);"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
